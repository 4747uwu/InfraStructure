# Router Hub production stack. Uploaded to the server by the Deploy workflow.
#
#   .env      IMAGE, IMAGE_TAG, SITE_ADDRESS   (written by the workflow)
#   app.env       address settings for the app (written by the workflow)
#   accounts.env  first-start account seeds, hashes only (from the repository)

name: routerhub

# Capped so container logs can never fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # No ports published: only the app container can reach the database.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - accounts.env
      - app.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: routerhub
      TRUST_PROXY: "1"
    volumes:
      - storage:/app/storage
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *logging

  # TLS termination. With a domain it obtains and renews certificates by itself.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  mongo-data: # the database
  storage: # uploaded installers
  caddy-data: # TLS certificates
  caddy-config:
